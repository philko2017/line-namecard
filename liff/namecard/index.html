<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://hook.us2.make.com https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; frame-src https://*.line.me; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>名片</title>
<style>
:root{
  --bg:#F4F3EE;--card:#FFFFFF;--text:#1E2A36;--soft:#5B6573;--muted:#8A93A0;--line:#E2E0D8;
  --green:#2B7A3D;--green-bg:#E3F1E6;--blue:#1F5FA8;--blue-bg:#E4EEF9;--amber:#8A5300;--amber-bg:#FFF1D6;
  --red:#B42318;--red-bg:#FDE7E5;--chip:#ECEAE3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15191E;--card:#1F252C;--text:#E8EAED;--soft:#AEB6C0;--muted:#7D8792;--line:#323A43;
  --green:#6BC283;--green-bg:#1E3325;--blue:#7DB2EE;--blue-bg:#1B2B3E;--amber:#F2B451;--amber-bg:#3A2C12;
  --red:#F2867B;--red-bg:#3D1E1B;--chip:#2A3139;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:8px}
.title h1{font-size:19px;font-weight:700;flex:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tabs button{padding:9px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--amber);color:#fff;font-size:12px;line-height:20px;margin-left:4px}
.hint{font-size:13px;color:var(--soft);margin-top:8px}
.shots{display:grid;gap:12px;margin-top:16px}
.shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:170px;border-radius:18px;border:2px dashed var(--line);background:var(--card);overflow:hidden;text-align:center;padding:12px}
.shot .big{font-size:38px;line-height:1}
.shot b{font-size:18px}
.shot small{color:var(--soft);font-size:13px}
.shot.has{border-style:solid;border-color:var(--green);padding:0}
.shot img{width:100%;max-height:260px;object-fit:cover;display:block}
.shot .redo{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:4px 10px;font-size:13px}
.shot.card{aspect-ratio:1.75/1;min-height:0}
.shot input{display:none}
label.f{display:block;margin-top:14px;font-size:14px;color:var(--soft)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
label.f textarea{min-height:64px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:528px;margin:0 auto}
.primary{width:100%;height:52px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:17px}
.primary:disabled{opacity:.4}
.queue{margin-top:16px;display:grid;gap:8px}
.q{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.q img{width:56px;height:34px;object-fit:cover;border-radius:6px}
.q span{flex:1;font-size:14px}
.q.fail{border-color:var(--red);background:var(--red-bg)}
.q button{font-size:14px;font-weight:700;color:var(--red)}
.list{display:grid;gap:10px;margin-top:14px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.item img,.item .ph{width:84px;height:48px;border-radius:8px;object-fit:cover;background:var(--chip);flex:none}
.item div{flex:1;min-width:0}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--soft);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;flex:none}
.st.wait{background:var(--amber-bg);color:var(--amber)}
.st.run{background:var(--chip);color:var(--soft)}
.st.fail{background:var(--red-bg);color:var(--red)}
.st.done{background:var(--green-bg);color:var(--green)}
.photos{display:grid;grid-template-columns:3fr 2fr;gap:8px;margin-top:14px}
.photos img{width:100%;height:120px;object-fit:cover;border-radius:12px;background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:6px 12px;border-radius:16px;background:var(--chip);font-size:14px}
.chips button.on{background:var(--blue);color:#fff}
.empty,.blocked{text-align:center;color:var(--soft);padding:48px 12px}
.blocked h2{color:var(--text);font-size:19px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;max-width:90%}
.back{font-size:15px;color:var(--blue);font-weight:700;margin-top:12px}
.zoom{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.zoom img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><h1>名片</h1></div>
    <div class="tabs">
      <button data-tab="shoot">📷 拍名片</button>
      <button data-tab="review">✅ 待確認</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js"></script>
</body>
</html>
